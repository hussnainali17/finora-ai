[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-firm-backend"
version = "0.1.0"
description = "CA Firm System API - accounting review and financial reporting (not a bookkeeping system)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "asyncpg>=0.29,<1.0",
  "redis>=5.0,<6.0",
  "httpx>=0.27,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "pyjwt>=2.8,<3.0",
  "email-validator>=2.1,<3.0",
  "python-multipart>=0.0.9",
  "boto3>=1.34,<2.0",
  "aiokafka>=0.11,<1.0",
  "pymupdf>=1.24",
  "openpyxl>=3.1,<4.0",
  "xlrd>=2.0.1,<3.0",
  "ocrmypdf>=16.0",
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "moto[server]>=5.0,<6.0",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S608", "E501"]
"migrations/*" = ["S608", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "alembic.*", "boto3.*", "botocore.*", "aiokafka.*", "moto.*", "pymupdf.*", "fitz.*", "xlrd.*", "ocrmypdf.*", "openpyxl.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.agents.intake_agent.parsers.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
