# LiteLLM Proxy configuration (Phase 0: gateway only, no approved models yet).
# Phase 4 defines approved model aliases. Provider keys come from environment
# variables on THIS container only (os.environ/...). Never inline keys here.
#
# Example alias to enable later (uncomment and set the key in .env):
#
# model_list:
#   - model_name: default-chat
#     litellm_params:
#       model: openai/gpt-4o-mini
#       api_key: os.environ/OPENAI_API_KEY

model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  request_timeout: 60
  num_retries: 2
