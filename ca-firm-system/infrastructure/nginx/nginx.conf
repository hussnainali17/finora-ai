# Development reverse proxy. Production TLS/hardening is addressed in Phase 11.
worker_processes auto;
events { worker_connections 1024; }

http {
  # Must be >= the backend's MAX_UPLOAD_BYTES (default 50 MiB) plus multipart overhead.
  # The backend enforces the real, per-file limit and returns 413 with a clear message.
  client_max_body_size 55m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Per-IP throttle on credential endpoints (per-account lockout lives in the backend).
  limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:5173; }

  server {
    listen 80;

    location = /api/v1/auth/login {
      limit_req zone=auth_login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    # Vite dev server (includes HMR websocket)
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }
  }
}
