# Development reverse proxy. Production TLS/hardening is addressed in Phase 11.
worker_processes auto;
events { worker_connections 1024; }

http {
  # Upload limit is a placeholder; Phase 2 makes file size limits configurable.
  client_max_body_size 100m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:5173; }

  server {
    listen 80;

    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    # Vite dev server (includes HMR websocket)
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }
  }
}
